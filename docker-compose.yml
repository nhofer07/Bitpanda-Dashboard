version: "3.8"

services:
  bitpanda-dashboard:
    build: .
    container_name: "${CONTAINER_NAME:-bitpanda-dashboard}"
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8085}:3001"
      - "127.0.0.1:1${DASHBOARD_PORT:-8085}:1${DASHBOARD_PORT:-8085}"
    environment:
      ALLOWED_HOSTS: "*"
      CREDENTIALS_STORAGE: "memory"
      DASHBOARD_AUTH: "required"
      CHATGPT_CALLBACK_HOST: "0.0.0.0"
      CHATGPT_CALLBACK_PORT: "1${DASHBOARD_PORT:-8085}"
      TZ: "Europe/Vienna"
    volumes:
      - "${DASHBOARD_DATA_PATH:-./data}:/data"
